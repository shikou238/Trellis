[workspace]
resolver = "3"
members = ["crates/dsl", "crates/engine", "crates/uikit", "crates/menu-proto"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
dsl = { path = "crates/dsl" }
engine = { path = "crates/engine" }
uikit = { path = "crates/uikit" }
anyhow = "1.0"
log = "0.4"

[profile.release]
strip = true
